name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # --notes is prepended to the auto-generated changelog (--generate-notes)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            --notes "## Container images

          | Image | Pull |
          |---|---|
          | Backend (IEC-104 + API) | \`ghcr.io/richyp7/iec60870-5-104-simulator:${VERSION}\` |
          | Web UI | \`ghcr.io/richyp7/iec60870-5-104-simulator-ui:${VERSION}\` |

          \`\`\`bash
          docker run -p 2404:2404 -p 8080:8080 ghcr.io/richyp7/iec60870-5-104-simulator:${VERSION}
          \`\`\`"
